apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: redhat-one-rf-demo
type: Opaque
stringData:
  POSTGRES_USER: "fraud_user"
  POSTGRES_PASSWORD: "fraud_password"
  POSTGRES_DB: "frauddb"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: redhat-one-rf-demo
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGDATA
              value: /tmp/pgdata
          envFrom:
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 5432
              name: postgres
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fraud_user", "-d", "frauddb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fraud_user", "-d", "frauddb"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: redhat-one-rf-demo
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres