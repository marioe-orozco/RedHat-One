apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: postgres-fraud-connector
  namespace: kafka
  labels:
    strimzi.io/cluster: fraud-kafka-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    plugin.name: "pgoutput"
    database.hostname: "postgres-service.redhat-one-rf-demo.svc.cluster.local"
    database.port: "5432"
    database.user: "fraud_user"
    database.password: "fraud_password"
    database.dbname: "frauddb"
    database.server.name: "fraud-db-server"
    table.include.list: "public.clients"
    topic.prefix: "fraud-events"