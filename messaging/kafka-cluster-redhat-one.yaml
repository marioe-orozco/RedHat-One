apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster-redhat-one
  namespace: kafka
spec:
  kafka:
    version: 4.1.0
    metadataVersion: "4.1-IV0"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka-cluster-redhat-one-pool
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster-redhat-one
spec:
  replicas: 1
  roles:
    - broker
    - controller
  template:
    pod:
      metadata:
        annotations:
          k8s.v1.cni.cncf.io/networks: ""
  storage:
    type: ephemeral