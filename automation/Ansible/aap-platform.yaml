# 03-aap-platform.yaml
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: ansible-automation-platform
spec:
  # Componentes
  controller:
    disabled: false
  eda:
    disabled: false
  hub:
    disabled: true          # desactivado para ahorrar recursos en CRC

  # Configuración general
  image_pull_policy: IfNotPresent
  no_log: false